crosoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">运营后台 · 营销配置</text><line x1="450" y1="655.0" x2="474" y2="655.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="480" y="624.0" width="120" height="62" rx="10" ry="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="540.0" y="660.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">营销活动生效</text><line x1="600" y1="655.0" x2="624" y2="655.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="630" y="624.0" width="218" height="62" rx="10" ry="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="739.0" y="660.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">C 端 · 秒杀 / 领券</text><line x1="848" y1="655.0" x2="872" y2="655.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="878" y="624.0" width="120" height="62" rx="10" ry="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="938.0" y="660.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">下单时抵扣</text><line x1="40" y1="740" x2="1380" y2="740" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="764" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#334155" font-weight="bold" text-anchor="start">读图要点：</text><text x="120" y="764" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">① 横向看是一条链，纵向看是「运营配置 → 业务能力 → 消费者感知」的同一条数据；</text><text x="40" y="790" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">② 一次下单要同时向会员、商品、营销、购物车四个方向取数，这是交易域最典型的协作形态；</text><text x="40" y="816" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">③ 售后与退款全程由运营在后台推进，消费者只感知状态变化。</text></svg>