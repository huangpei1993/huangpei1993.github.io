url(#a)"/><rect x="838" y="316.0" width="120" height="62" rx="10" ry="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="898.0" y="352.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">支付</text><line x1="958" y1="347.0" x2="982" y2="347.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="988" y="316.0" width="190" height="62" rx="10" ry="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="1083.0" y="352.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">运营后台 · 订单发货</text><line x1="1178" y1="347.0" x2="1202" y2="347.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="1208" y="316.0" width="134" height="62" rx="10" ry="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="1275.0" y="352.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">消费者确认收货</text><rect x="40" y="436" width="180" height="130" rx="12" ry="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/><text x="130.0" y="507.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#f59e0b" font-weight="bold" text-anchor="middle">从申请到退款</text><rect x="260" y="470.0" width="120" height="62" rx="10" ry="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="320.0" y="506.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">申请售后</text><line x1="380" y1="501.0" x2="404" y2="501.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="410" y="470.0" width="120" height="62" rx="10" ry="10" fill="#ffffff" stroke="