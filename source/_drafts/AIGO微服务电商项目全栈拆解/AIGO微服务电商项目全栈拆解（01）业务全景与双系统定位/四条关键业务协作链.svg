<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="830" viewBox="0 0 1420 830"><rect width="1420" height="830" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><text x="40" y="50" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" fill="#0f172a" font-weight="bold" text-anchor="start">四条关键业务协作链</text><text x="40" y="80" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">运营端的配置如何抵达消费者、消费者的一次交易又如何回到运营端</text><rect x="40" y="128" width="180" height="130" rx="12" ry="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.6"/><text x="130.0" y="199.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#0ea5e9" font-weight="bold" text-anchor="middle">上架到可见</text><rect x="260" y="162.0" width="190" height="62" rx="10" ry="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/><text x="355.0" y="198.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">运营后台 · 商品管理</text><line x1="450" y1="193.0" x2="474" y2="193.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="480" y="162.0" width="120" height="62" rx="10" ry="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/><text x="540.0" y="198.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#334155" font-weight="bold" text-anchor="middle">商品与库存</text><line x1="600" y1="193.0" x2="624" y2="193.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="630" y="162.0" width="288" height="62" rx="10" ry="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5